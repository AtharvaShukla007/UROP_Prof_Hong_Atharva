[project]
name = "urop-agent-diagnosis"
version = "0.0.1"
description = "UROP (Prof. Hong, NUS ECE): diagnosing agent decision-point failures from hidden states, built on AutoTraceGT."
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
